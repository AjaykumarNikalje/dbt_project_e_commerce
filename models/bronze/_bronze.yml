models:
- name: brz_customers
  description: 'bronze customer table '
  config:
    materialized: incremental
    incremental_strategy: append
    file_format: delta
    on_schema_change: sync_all_columns
    docs:
      show: true
      node_color: '#CD7F32'
    access: public
  columns:
  - name: customer_id
    description: primary key, unique and not null
    quote: true
    data_type: string
  - name: customer_name
    description: customer full name
    data_type: string
    config:
      meta:
        contains_pii: true
  - name: email
    description: email description
    data_type: string
  - name: country
    data_type: string
  - name: segment
    data_type: string
  - name: signup_date
    data_type: string
  - name: source_inserted_at
    data_type: string
  - name: source_updated_at
    data_type: string
  - name: ingested_at
    data_type: timestamp
  - name: batch_id
    data_type: string
  - name: operation_type
    data_type: string
  - name: source_file
    data_type: string
  data_tests:
  - bronze_silver_rules:
      arguments:
        entity: customers
        required_columns:
        - customer_id
        - customer_name
        - email
        - country
        - segment
        - signup_date
        - source_inserted_at
        - source_updated_at
        - brz_ingested_at
        - slr_ingested_at
        - slr_updated_at
        - operation_type
        - source_file
        accepted_values:
          segment:
          - STANDARD
          - PREMIUM
          operation_type:
          - INSERT
          - UPDATE
          - DELETE
- name: brz_orders
  description: 'bronze order table '
  config:
    materialized: incremental
    incremental_strategy: append
    file_format: delta
    on_schema_change: sync_all_columns
    docs:
      show: true
      node_color: '#CD7F32'
    access: public
  columns:
  - name: order_id
    description: Order identifier; may repeat across source events.
    data_type: string
  - name: customer_id
    description: Customer placing the order; relationship validated in Silver.
    data_type: string
  - name: amount
    description: Raw amount; converted to decimal(18,2) and validated in Silver.
    data_type: string
  - name: status
    description: Raw order status; allowed values validated in Silver.
    data_type: string
  - name: source_inserted_at
    description: Raw order date/time; converted and validated in Silver.
    data_type: string
  - name: source_updated_at
    description: Source change date/time; timestamp validity checked by preflight.
    data_type: string
  - name: ingested_at
    description: Timestamp generated when the pipeline loads the event.
    data_type: timestamp
  - name: batch_id
    description: Source batch identifier.
    data_type: string
  - name: operation_type
    description: INSERT or UPDATE; validated by preflight.
    data_type: string
  - name: source_file
    description: Source filename.
    data_type: string
  data_tests:
  - bronze_silver_rules:
      arguments:
        entity: orders
        required_columns:
        - order_id
        - customer_id
        - amount
        - status
        - source_inserted_at
        - source_updated_at
        - brz_ingested_at
        - slr_ingested_at
        - slr_updated_at
        - batch_id
        - operation_type
        - source_file
        accepted_values:
          status:
          - PLACED
          - COMPLETED
          - CANCELLED
          - REFUNDED
          operation_type:
          - INSERT
          - UPDATE
        range_checks:
          amount:
            min: 0
            max: 100000
