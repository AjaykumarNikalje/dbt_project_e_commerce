name: e_commerce

config-version: 2
version: '1.0.0'

profile: ecommerce_lakehouse_dbt

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
analysis-paths: [analysis]
macro-paths: [macros]
snapshot-paths: [snapshots]
docs-paths: [docs]
asset-paths: [assets]
function-paths: [functions]

packages-install-path: dbt_packages

clean-targets: ['target','dbt_packages']

query-comment: "e_commerce dbt project"

require-dbt-version: [">=1.10.0", "<2.0.0"]

flags:
  fail_fast: true
  use_colors: true
  send_anonymous_usage_stats: false


analyses:                    # How those files are configured
  e_commerce:
    +enabled: true
    +tags: ["reporting"]

exposures:
  +enabled: true

quoting:
  database: true 
  schema: true 
  identifier: true 

metrics:
  e_commerce: 
    +enabled: true

seeds:
  e_commerce:
    +quote_columns: false
    src_customers:
      +column_types:
        customer_id: string
        signup_date: string
        source_inserted_at: string
        source_updated_at: string
    src_orders:
      +column_types:
        order_id: string
        customer_id: string
        amount: string
        source_inserted_at: string
        source_updated_at: string


vars:
  initial_watermark: "1900-01-01 00:00:00"
  allowed_customer_segments: ["STANDARD", "PREMIUM"]
  allowed_order_statuses: ["PLACED", "COMPLETED", "CANCELLED", "REFUNDED"]
  max_order_amount: 100000
  enable_run_logging: true

on-run-start:
  - "{{ log_run_start() }}"
on-run-end:
  - "{{ log_run_end(results) }}"


functions:
  e_commerce:
    +enabled: true
    +schema: utilities
